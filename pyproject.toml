[tool.ruff]
line-length = 120
target-version = "py310"
# Third-party fork code follows upstream style, not enforced SLF001
exclude = []

[tool.ruff.lint]
select = ["E", "F", "W", "I", "SLF001"]

[tool.ruff.lint.per-file-ignores]
# Test files allow white-space access
"tests/**" = ["SLF001"]
# __init__.py allows re-export
"**/__init__.py" = ["SLF001", "F401"]
# Protobuf 自动生成文件
"**/*_pb2.py" = ["SLF001"]
"**/grpc_stubs/**" = ["SLF001"]
"**/proto/**" = ["SLF001"]
# TODO(euler-migration): drone_driver 涉及 actuator_ctrlrange/jnt_qposadr/xfrc_applied/contact 等
# Euler 体系未委托的 API，待 OrcaGym 侧扩展后移除
"examples/embodied/drone_driver/**" = ["SLF001"]
# TODO(euler-migration): fluid trajectory/run_simulation 需要 mjModel/mjData 用于
# MuJoCo passive viewer / geom 遍历 / contact 诊断，待 OrcaGym 侧扩展后移除
# TODO: 既有跨类私有访问（agent/state_processor/keyboard 内部属性），待重构类接口后移除
"examples/embodied/g1/**" = ["SLF001"]
"examples/embodied/wheeled_chassis/**" = ["SLF001"]
"examples/embodied/zq_sa01/run_zqsa01.py" = ["SLF001"]
# TODO(euler-migration): d12 demo OSC 控制器需要 mj_fullM（Euler 未暴露 qM），
# 待 OrcaGym 侧在 OrcaGymEuler/MuJoCoSimCore 添加 mj_fullM 公共方法后移除
"examples/embodied/d12/**" = ["SLF001"]
