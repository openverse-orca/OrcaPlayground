id: 10
title: 改变颜色
stage: 2
layer: 2
scene_mode: spawn
prerequisites: [lesson_09_scale_object]
entry: python -m examples.euler.beginner.stage2_scene_editing.lesson_10_color_object.run
asset_packages: [OrcaPlaygroundAssets]
expected_result: 方块 spawn 后变为配方区 BOX_RGBA 指定的颜色（set_material_info 运行时改材质）
challenge: 加一颗 box_2 并用 set_material_info 给它不同颜色，与 box_1 表面间隔 0.8 米（中心距 1.8 米）
challenge_type: combine
rebuild_scene: true
tunable_params:
  - name: BOX_RGBA
    default: (0.9, 0.1, 0.1, 1.0)
    unit: RGB（每个分量 0~1；A 固定 1.0，暂不生效）
